<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MagMap Scanner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #020617; /* Slate 950 */
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
            overflow: hidden;
            touch-action: none; /* Prevent scrolling when drawing */
            user-select: none;
        }
        #heatmapCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            z-index: 10;
        }
    </style>
</head>
<body class="flex flex-col h-screen relative w-full">

    <!-- Canvas for Heatmap -->
    <canvas id="heatmapCanvas"></canvas>

    <!-- Top Info Bar -->
    <div class="glass-panel absolute top-4 left-4 right-4 rounded-2xl p-4 flex justify-between items-center shadow-lg">
        <div class="flex flex-col">
            <h1 class="text-lg font-bold tracking-wide text-white">MagMap <span class="text-cyan-400">Scanner</span></h1>
            <div id="statusBadge" class="flex items-center gap-2 mt-1">
                <span class="relative flex h-3 w-3">
                  <span id="statusPing" class="animate-ping absolute inline-flex h-full w-full rounded-full bg-slate-400 opacity-75"></span>
                  <span id="statusDot" class="relative inline-flex rounded-full h-3 w-3 bg-slate-500"></span>
                </span>
                <span id="statusText" class="text-xs font-mono text-slate-300">Awaiting Start...</span>
            </div>
        </div>
        
        <div class="text-right flex flex-col items-end">
            <div class="flex items-baseline gap-1">
                <span id="magValue" class="text-3xl font-black text-cyan-400 tabular-nums">0.0</span>
                <span class="text-sm text-slate-400 font-bold">μT</span>
            </div>
            <span class="text-[10px] uppercase tracking-widest text-slate-500">Field Strength</span>
        </div>
    </div>

    <!-- Start Overlay -->
    <div id="startOverlay" class="absolute inset-0 z-50 flex items-center justify-center bg-slate-950/80 backdrop-blur-sm transition-opacity duration-300">
        <div class="glass-panel p-8 rounded-3xl max-w-sm w-full mx-4 text-center flex flex-col items-center gap-6 shadow-2xl">
            <div class="w-16 h-16 bg-cyan-500/20 rounded-full flex items-center justify-center border border-cyan-500/30">
                <svg class="w-8 h-8 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                </svg>
            </div>
            <div>
                <h2 class="text-xl font-bold text-white mb-2">Magnetic Scanner</h2>
                <p class="text-sm text-slate-300 leading-relaxed">
                    Drag your finger or mouse across the screen to map the magnetic field.
                </p>
            </div>
            <button id="startBtn" class="w-full bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white font-bold py-4 px-8 rounded-xl shadow-lg shadow-cyan-500/25 active:scale-95 transition-all">
                START SCANNING
            </button>
        </div>
    </div>

    <!-- Bottom Controls -->
    <div class="glass-panel absolute bottom-4 left-4 right-4 rounded-2xl p-4 flex flex-col gap-4 shadow-lg transition-transform duration-300 translate-y-[150%]" id="bottomControls">
        <div id="simWarning" class="hidden bg-yellow-500/10 border border-yellow-500/20 rounded-lg p-3 text-xs text-yellow-200/90 leading-relaxed">
            <strong class="text-yellow-400">Simulation Mode Active:</strong> Your browser/device doesn't support the hardware sensor. We've hidden virtual magnets on the screen for you to find!
        </div>
        
        <div class="flex justify-between items-center">
            <div class="flex items-center gap-3 w-1/2">
                <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
                <input type="range" id="brushSize" min="30" max="150" value="80" class="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-cyan-400">
            </div>
            <button id="clearBtn" class="bg-slate-700 hover:bg-slate-600 text-slate-200 px-4 py-2 rounded-lg text-xs font-bold transition-colors shadow-sm">
                CLEAR MAP
            </button>
        </div>
    </div>

    <script>
        // --- Setup & State ---
        const canvas = document.getElementById('heatmapCanvas');
        const ctx = canvas.getContext('2d', { alpha: false }); // Optimize
        
        const ui = {
            statusText: document.getElementById('statusText'),
            statusDot: document.getElementById('statusDot'),
            statusPing: document.getElementById('statusPing'),
            magValue: document.getElementById('magValue'),
            startOverlay: document.getElementById('startOverlay'),
            startBtn: document.getElementById('startBtn'),
            bottomControls: document.getElementById('bottomControls'),
            clearBtn: document.getElementById('clearBtn'),
            brushSize: document.getElementById('brushSize'),
            simWarning: document.getElementById('simWarning')
        };

        let isScanning = false;
        let mode = 'pending'; // pending, real, sim
        let currentMag = 45.0; // Earth average in microteslas
        let brushRadius = 80;
        
        // Input tracking
        let pointer = { x: -1000, y: -1000, active: false };
        let virtualMagnets = [];

        // --- Canvas Sizing ---
        function resizeCanvas() {
            // Handle high-DPI displays
            const dpr = window.devicePixelRatio || 1;
            canvas.width = window.innerWidth * dpr;
            canvas.height = window.innerHeight * dpr;
            ctx.scale(dpr, dpr);
            
            // Fill initial dark background
            ctx.fillStyle = '#020617';
            ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // --- Sensor Logic ---
        async function initializeSensors() {
            ui.startOverlay.style.opacity = '0';
            setTimeout(() => ui.startOverlay.style.display = 'none', 300);
            ui.bottomControls.classList.remove('translate-y-[150%]');

            try {
                // 1. Check if API exists
                if (!('Magnetometer' in window)) {
                    throw new Error("API Not Supported");
                }

                // 2. Try to start sensor
                const sensor = new Magnetometer({ frequency: 60 });
                
                sensor.addEventListener('reading', () => {
                    if (mode !== 'real') setMode('real');
                    // Calculate total magnitude vector: sqrt(x^2 + y^2 + z^2)
                    currentMag = Math.sqrt(sensor.x**2 + sensor.y**2 + sensor.z**2);
                });

                sensor.addEventListener('error', event => {
                    throw new Error(event.error.name);
                });

                sensor.start();

            } catch (error) {
                console.warn("Real sensor failed, falling back to Simulation:", error.message);
                setupSimulation();
                setMode('sim');
            }
            
            isScanning = true;
            requestAnimationFrame(drawLoop);
        }

        function setMode(newMode) {
            mode = newMode;
            if (mode === 'real') {
                ui.statusText.innerText = "LIVE SENSOR ACTIVE";
                ui.statusText.className = "text-xs font-mono text-green-400";
                ui.statusDot.className = "relative inline-flex rounded-full h-3 w-3 bg-green-500";
                ui.statusPing.className = "animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75";
                ui.simWarning.classList.add('hidden');
            } else if (mode === 'sim') {
                ui.statusText.innerText = "SIMULATION MODE";
                ui.statusText.className = "text-xs font-mono text-yellow-400";
                ui.statusDot.className = "relative inline-flex rounded-full h-3 w-3 bg-yellow-500";
                ui.statusPing.className = "animate-ping absolute inline-flex h-full w-full rounded-full bg-yellow-400 opacity-75";
                ui.simWarning.classList.remove('hidden');
            }
        }

        // --- Simulation Logic ---
        function setupSimulation() {
            // Create 3 random hidden "magnets" on the screen
            const padding = 100;
            virtualMagnets = [];
            for (let i = 0; i < 3; i++) {
                virtualMagnets.push({
                    x: padding + Math.random() * (window.innerWidth - padding * 2),
                    y: padding + Math.random() * (window.innerHeight - padding * 2),
                    strength: 150 + Math.random() * 300, // 150 to 450 uT
                    radius: 150 + Math.random() * 150
                });
            }
        }

        function updateSimulationValue() {
            let baseField = 45; // Earth magnetic field
            let addedField = 0;

            // If user isn't touching the screen, return to base level
            if (!pointer.active) {
                currentMag = baseField + (Math.random() * 2 - 1); // slight jitter
                return;
            }

            // Calculate distance to virtual magnets
            virtualMagnets.forEach(mag => {
                const dist = Math.hypot(pointer.x - mag.x, pointer.y - mag.y);
                if (dist < mag.radius) {
                    // Closer = stronger field (inverse relationship)
                    const intensity = 1 - (dist / mag.radius);
                    addedField += mag.strength * Math.pow(intensity, 2);
                }
            });

            currentMag = baseField + addedField + (Math.random() * 4 - 2); // Add jitter
        }

        // --- Drawing & UI Logic ---
        function getHeatColor(magnitude) {
            // Range: 30uT (Blue) to 300+uT (Red)
            const min = 35;  
            const max = 250; 
            const ratio = Math.min(Math.max((magnitude - min) / (max - min), 0), 1);
            
            // HSL: 240 (Blue) -> 120 (Green) -> 60 (Yellow) -> 0 (Red)
            const hue = (1 - ratio) * 240;
            
            if (magnitude > 150) return `hsla(${hue}, 100%, 60%, 0.15)`; // Brighter for strong magnets
            return `hsla(${hue}, 100%, 50%, 0.08)`;
        }

        function drawLoop() {
            if (!isScanning) return;

            // If in sim mode, calculate the fake value based on pointer
            if (mode === 'sim') {
                updateSimulationValue();
            }

            // Update Number Display
            ui.magValue.innerText = currentMag.toFixed(1);
            
            // Change color of text if strong
            if (currentMag > 150) {
                ui.magValue.className = "text-3xl font-black text-red-400 tabular-nums";
            } else if (currentMag > 80) {
                ui.magValue.className = "text-3xl font-black text-yellow-400 tabular-nums";
            } else {
                ui.magValue.className = "text-3xl font-black text-cyan-400 tabular-nums";
            }

            // Draw on canvas if pointer is active
            if (pointer.active) {
                const color = getHeatColor(currentMag);
                
                const gradient = ctx.createRadialGradient(
                    pointer.x, pointer.y, 0, 
                    pointer.x, pointer.y, brushRadius
                );
                gradient.addColorStop(0, color);
                gradient.addColorStop(1, 'transparent');
                
                ctx.globalCompositeOperation = 'screen'; // Blend mode for glowing heatmap effect
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(pointer.x, pointer.y, brushRadius, 0, Math.PI * 2);
                ctx.fill();
            }

            requestAnimationFrame(drawLoop);
        }

        // --- Event Listeners ---
        ui.startBtn.addEventListener('click', initializeSensors);

        ui.clearBtn.addEventListener('click', () => {
            ctx.globalCompositeOperation = 'source-over';
            ctx.fillStyle = '#020617';
            ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);
            // Re-randomize magnets if in sim mode to make it fun again
            if (mode === 'sim') setupSimulation();
        });

        ui.brushSize.addEventListener('input', (e) => {
            brushRadius = parseInt(e.target.value);
        });

        // Pointer tracking for both Mouse and Touch
        function updatePointer(e) {
            // Prevent default scrolling on touch
            if(e.cancelable) e.preventDefault(); 
            
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            
            pointer.x = clientX;
            pointer.y = clientY;
        }

        window.addEventListener('pointerdown', (e) => {
            pointer.active = true;
            updatePointer(e);
        }, {passive: false});

        window.addEventListener('pointermove', (e) => {
            if (pointer.active) updatePointer(e);
        }, {passive: false});

        window.addEventListener('pointerup', () => pointer.active = false);
        window.addEventListener('pointercancel', () => pointer.active = false);

        // Touch specific fallbacks to ensure smooth drawing on mobile
        window.addEventListener('touchstart', (e) => {
            pointer.active = true;
            updatePointer(e);
        }, {passive: false});
        
        window.addEventListener('touchmove', (e) => {
            if (pointer.active) updatePointer(e);
        }, {passive: false});
        
        window.addEventListener('touchend', () => pointer.active = false);

    </script>
</body>
</html>
